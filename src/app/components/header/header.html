<header class="header">
  <div class="container">
    <a href="#" class="logo">
      <span class="logo-rc">RC</span>
      <span class="logo-name">Rigoberto Caionda</span>
    </a>

    <nav class="desktop-nav">
      @for (link of links; track link.href) {
        <a [href]="link.href">{{ link.label }}</a>
      }
      <a href="#contact" class="btn btn-primary">Vamos conversar</a>
    </nav>

    <button
      class="hamburger"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>

@if (mobileMenuOpen()) {
  <div class="mobile-menu">
    <button class="mobile-close" (click)="closeMobileMenu()" aria-label="Close navigation menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <nav class="mobile-nav">
      @for (link of links; track link.href) {
        <a [href]="link.href" (click)="closeMobileMenu()">{{ link.label }}</a>
      }
      <a href="#contact" class="btn btn-primary" (click)="closeMobileMenu()">Vamos conversar</a>
    </nav>
  </div>
}
